name: DeluxeMenus
version: '${version}'
main: com.extendedclip.deluxemenus.DeluxeMenus
description: All in one inventory menu system
authors: [ HelpChat ]
api-version: '1.20.6'

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    Vault:
      load: BEFORE
      required: false
      join-classpath: true
    HeadDatabase:
      load: BEFORE
      required: false
      join-classpath: true
    HeadDB:
      load: BEFORE
      required: false
      join-classpath: true
    CraftEngine:
      load: BEFORE
      required: false
      join-classpath: true
    ItemsAdder:
      load: BEFORE
      required: false
      join-classpath: true
    Nexo:
      load: BEFORE
      required: false
      join-classpath: true
    Oraxen:
      load: BEFORE
      required: false
      join-classpath: true
    ExecutableItems:
      load: BEFORE
      required: false
      join-classpath: true
    ExecutableBlocks:
      load: BEFORE
      required: false
      join-classpath: true
    Score:
      load: BEFORE
      required: false
      join-classpath: true
    SimpleItemGenerator:
      load: BEFORE
      required: false
      join-classpath: true
    MMOItems:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  deluxemenus.admin:
    description: admin commands
    default: op
  deluxemenus.open:
    description: open a menu with /dm open <menu>
    default: op
  deluxemenus.open.others:
    description: open a menu with /dm open <menu> <player>
    default: op
  deluxemenus.open.bypass:
    description: attempt to open a menu for a viewer skipping view requirement checking for the player
    default: op
  deluxemenus.menu.*:
    description: permission for all menus
    default: op
  deluxemenus.openrequirement.bypass.*:
    description: Allows the viewer to bypass all menu open requirements
    default: op
  deluxemenus.placeholdersfor:
    description: permission to parse menu placeholders with /dm open <menu> p:<player>
    default: op
  deluxemenus.placeholdersfor.exempt:
    description: exempt from placeholders being parsed when targeted with /dm open <menu p:<player> for players with this permission
    default: op
